# /etc/nginx/sites-available/yeke-jewelry
# ln -s /etc/nginx/sites-available/yeke-jewelry /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com;
    # 用 certbot 配好 HTTPS 后这里会被自动改写，保留用于 HTTP→HTTPS 跳转
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;

    # certbot 自动填写这两行:
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # 图片上传大小限制（单次请求，建议比应用层稍大）
    client_max_body_size 30M;

    # 上传的图片直接由 Nginx 提供，绕过 Node 进程，更快
    location /uploads/ {
        alias /var/www/yeke-jewelry/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 防止直接列目录
        autoindex off;
    }

    # Next.js 静态资源（_next/static）走 Nginx 缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 其余请求转发到 Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
